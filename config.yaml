# =============================================================================
# 拼豆图纸生成器 - 配置文件
# =============================================================================
# 当前版本：豆包方舟（Volcengine ARK）图像生成工作流
#   Step 1: SeedDream 图生图（照片转卡通）
#   Step 2: SeedEdit 局部重绘（可选，蒙版消除水印/杂物/背景等）
#
# 两个步骤可独立启用，pipeline 节点控制。
# 后续如需接入对话型多模态 API（GPT-4o / Claude / Qwen-VL），追加 llm 节点。

# -----------------------------------------------------------------------------
# 方舟平台（豆包）连接信息
# -----------------------------------------------------------------------------
ark:

  # API Key
  # 获取：火山引擎控制台 -> 火山方舟 -> API Key 管理
  # 真实密钥存于 .env（ARK_API_KEY），此处用 env: 引用，避免明文入库
  api_key: "env:ARK_API_KEY"

  # 图像生成端点
  # 国内默认就是下面这个，一般不用改
  # 海外或代理场景下可修改
  base_url: "https://ark.cn-beijing.volces.com/api/v3/images/generations"

  # 单次请求超时（秒）
  timeout: 120

  # 失败重试次数（网络抖动时使用）
  max_retries: 3

  # HTTP 代理（可选；当前网络直连可达，留空）
  # 例: http://127.0.0.1:7890  或  socks5://127.0.0.1:1080
  proxy: ""

  # -----------------------------------------------------------------------------
  # 工作流开关
  # -----------------------------------------------------------------------------
  pipeline:

    # 是否启用 Step 1 卡通化
    enable_cartoonize: true

    # 是否启用 Step 2 局部重绘（消除）
    # 注意: 启用时必须提供蒙版文件
    enable_inpaint: false

  # -----------------------------------------------------------------------------
  # Step 1: 卡通化（图生图）
  # -----------------------------------------------------------------------------
  cartoonize:

    # 模型名称
    # 在方舟控制台"在线推理"创建接入点后获得，例如:
    #   doubao-seedream-5-0-pro-260628   (5.0 Pro 最新)
    #   doubao-seedream-4.5
    #   doubao-seedream-3.0-t
    #   ep-xxxxxxxxxxxx  (自定义推理接入点 ID)
    model: "doubao-seedream-5-0-pro-260628"

    # 图生图相似度，0~1
    # 越小越自由发挥（更卡通），越大越贴近原图
    # 推荐范围: 0.50(夸张卡通) ~ 0.75(保留姿态)
    image_strength: 0.65

    # 输出图片尺寸
    # 简写: "1K" | "2K" | "4K"
    # 也可写 "WIDTHxHEIGHT" 自定义（如 "1024x1024"）
    # 注意: 当前模型 doubao-seedream-5-0-pro 最低支持 1K
    size: "1K"

  # -----------------------------------------------------------------------------
  # Step 2: 局部重绘 / 蒙版消除
  # -----------------------------------------------------------------------------
  inpaint:

    # 模型名称
    # 可选: doubao-seededit-3.0-t / doubao-seededit-3.0-i
    #   后缀 -t 偏向文字/通用，-i 偏向图像/插画
    model: "doubao-seededit-3.0-t"

    # 默认 prompt（调用时不传则用这个）
    # 蒙版消除的通用指令：让模型"无缝补全"
    default_prompt: "消除指定区域，画面保持原有卡通风格，无缝填充背景"

    # 蒙版约定（与方舟 API 保持一致）
    #   黑色 (RGB=0,0,0)       = 需要重绘/消除的区域
    #   白色 (RGB=255,255,255) = 需要保留的区域
    mask_convention: "black_is_inpaint"


# -----------------------------------------------------------------------------
# 发送给 API 前的图片预处理（节省 token & 费用）
# -----------------------------------------------------------------------------
image:

  # 缩放后图片的最大边长（像素）。原图超过则等比缩小。
  # 建议 1024~2048，过小会丢失细节影响卡通化效果
  max_side: 1024

  # 编码格式
  #   jpeg - 体积小，照片类原图推荐
  #   png  - 无损，线稿/卡通图推荐
  format: "jpeg"

  # JPEG 质量 (1~100)，仅 format=jpeg 时生效
  quality: 85


# -----------------------------------------------------------------------------
# 对话型多模态 API（用于视觉理解 / prompt 设计 / SVG 生成）
# -----------------------------------------------------------------------------
# provider: codexcn | minimax | openai | anthropic | gemini | qwen
# 当前走 MiniMax M3（国内直连 api.minimax.chat，不受网络环境影响）
llm:
  provider: "minimax"
  # 真实密钥存于 .env（LLM_API_KEY），此处用 env: 引用，避免明文入库
  api_key: "env:LLM_API_KEY"
  base_url: "https://api.minimax.chat/v1"
  model: "MiniMax-M3"
  timeout: 120
  max_retries: 3
  temperature: 0.7
  max_tokens: 4096
  # MiniMax M3 默认开启思考，关闭以直接返回 content
  disable_thinking: true

  # 是否使用代理（与 ark.proxy 同源；直连可用时留空）
  proxy: ""
